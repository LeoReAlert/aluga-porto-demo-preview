<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">Kauan Jetss</title>
  <desc id="desc">Logo com wordmark inclinado e silhueta de jet ski em azul, verde e amarelo.</desc>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102234"/>
      <stop offset="35%" stop-color="#0F6CC9"/>
      <stop offset="72%" stop-color="#009C3B"/>
      <stop offset="100%" stop-color="#08203A"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="32%" stop-color="#f1f6fb"/>
      <stop offset="64%" stop-color="#aeb9c7"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFDF00"/>
      <stop offset="100%" stop-color="#FFB800"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#011423" flood-opacity=".42"/>
    </filter>
  </defs>

  <g filter="url(#shadow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M108 220c57-88 213-161 404-161 104 0 204 22 286 61 58 27 111 65 149 104" stroke="url(#chrome)" stroke-width="9"/>
    <path d="M124 236c59-78 200-143 369-143 103 0 196 21 274 57 54 25 99 58 136 93" stroke="url(#body)" stroke-width="18"/>
    <path d="M147 242c71-54 171-92 294-103 130-12 245 8 338 55 44 22 84 51 118 83" stroke="url(#gold)" stroke-width="6" opacity=".92"/>
    <path d="M217 213c70-38 154-59 249-65 84-5 162 4 233 27" stroke="#ffffff" stroke-width="4" opacity=".92"/>
    <path d="M344 181c47-31 96-49 149-55 37-4 72-2 104 6" stroke="#ffffff" stroke-width="3.5" opacity=".9"/>
    <path d="M538 159c42 1 87 12 134 33" stroke="#ffffff" stroke-width="3" opacity=".8"/>
    <path d="M108 220c58-12 110-11 153 4" stroke="#ffffff" stroke-width="4" opacity=".75"/>
    <path d="M894 246c63 22 112 49 146 81" stroke="url(#chrome)" stroke-width="6"/>
    <path d="M642 262c42-14 88-20 138-19 44 1 86 7 124 18" stroke="#ffffff" stroke-width="3.5" opacity=".78"/>
    <path d="M165 293c139-30 280-42 430-35 169 7 303 32 405 76" stroke="url(#body)" stroke-width="12"/>
  </g>

  <g transform="translate(130 168) skewX(-12)" filter="url(#shadow)">
    <text x="0" y="180"
      font-family="Arial Black, Montserrat, sans-serif"
      font-size="146"
      font-style="italic"
      font-weight="900"
      letter-spacing="-8"
      fill="url(#body)"
      stroke="url(#chrome)"
      stroke-width="5"
      paint-order="stroke fill">
      KAUAN
    </text>
    <text x="220" y="274"
      font-family="Arial Black, Montserrat, sans-serif"
      font-size="88"
      font-style="italic"
      font-weight="900"
      letter-spacing="5"
      fill="url(#body)"
      stroke="url(#chrome)"
      stroke-width="4"
      paint-order="stroke fill">
      JETSS
    </text>
  </g>

  <path d="M356 415c120 26 258 25 412-4" stroke="url(#gold)" stroke-width="9" stroke-linecap="round"/>
  <path d="M332 429c144 34 303 32 478-3" stroke="url(#chrome)" stroke-width="5" stroke-linecap="round" opacity=".8"/>
</svg>
