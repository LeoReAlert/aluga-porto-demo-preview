<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Catálogo online Kauan Jetss — casas, lanchas e jet skis em Porto Rico, PR." />
  <title>Kauan Jetss | Catálogo de aluguel</title>
  <link rel="icon" type="image/png" href="assets/img/favicon-kauan-jetss.png" />
  <link rel="shortcut icon" href="assets/img/favicon-kauan-jetss.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Saira:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="site-header" id="inicio">
    <div class="container nav-wrap">
      <a class="brand" href="#inicio" aria-label="Kauan Jetss - início">
        <img class="brand-logo" src="assets/img/logo-kauan-jetss.svg" alt="Kauan Jetss" />
        <span class="brand-copy"><strong>Kauan Jetss</strong><small>Porto Rico • Paraná</small></span>
      </a>
    </div>
  </header>

  <main class="catalog-page">
    <section class="catalog-section" id="catalogo">
      <div class="container">
        <div class="catalog-heading">
          <div>
            <span class="eyebrow dark">Catálogo de aluguel</span>
            <h1>Aluguéis disponíveis</h1>
          </div>
        </div>

        <div class="search-panel" aria-label="Busca e filtros">
          <label>
            <span>Categoria</span>
            <select id="categorySelect">
              <option value="todos">Todas as opções</option>
              <option value="casa">Casas de temporada</option>
              <option value="lancha">Lanchas</option>
              <option value="jetski">Jet skis</option>
            </select>
          </label>
          <label>
            <span>Data desejada</span>
            <input id="dateInput" type="date" />
          </label>
          <label>
            <span>Quantidade de pessoas</span>
            <select id="peopleSelect">
              <option value="">Qualquer quantidade</option>
              <option value="2">Até 2 pessoas</option>
              <option value="6">Até 6 pessoas</option>
              <option value="10">Até 10 pessoas</option>
              <option value="15">Até 15 pessoas</option>
            </select>
          </label>
          <label>
            <span>Dias de locação</span>
            <select id="rentalDays">
              <option value="1">1 dia</option>
              <option value="2">2 dias</option>
              <option value="3">3 dias</option>
              <option value="4">4 dias</option>
              <option value="5">5 dias</option>
              <option value="7">7 dias</option>
              <option value="10">10 dias</option>
              <option value="15">15 dias</option>
              <option value="30">30 dias</option>
            </select>
          </label>
          <button class="btn btn-dark" id="searchButton" type="button">Buscar</button>
        </div>

        <div class="filters" role="group" aria-label="Filtrar catálogo">
          <button class="filter active" data-filter="todos">Todos</button>
          <button class="filter" data-filter="casa">Casas</button>
          <button class="filter" data-filter="lancha">Lanchas</button>
          <button class="filter" data-filter="jetski">Jet skis</button>
        </div>

        <div class="catalog-grid" id="catalogGrid"></div>
        <p class="empty-state" id="emptyState" hidden>Nenhuma opção encontrada para esses filtros.</p>
      </div>
    </section>
  </main>

  <aside class="selection-drawer" id="selectionDrawer" aria-hidden="true">
    <div class="drawer-backdrop" data-close-selection></div>
    <div class="drawer-panel">
      <div class="drawer-header">
        <div><small>Seu pedido</small><h2>Minha seleção</h2></div>
        <button type="button" data-close-selection aria-label="Fechar">×</button>
      </div>
      <div class="drawer-content">
        <div id="selectedItems" class="selected-items"></div>
        <div id="selectedEmpty" class="selected-empty"><span>♡</span><p>Você ainda não selecionou nenhuma opção.</p></div>

        <form id="whatsappForm" class="interest-form">
          <label><span>Nome</span><input id="customerName" type="text" placeholder="Ex.: Cliente Kauan Jetss" /></label>
          <label><span>Telefone</span><input id="customerPhone" type="tel" placeholder="Ex.: (44) 90000-0000" /></label>
          <label><span>Endereço / referência</span><input id="customerAddress" type="text" placeholder="Ex.: Porto Rico, próximo à marina" /></label>
          <label><span>Tipo de serviço</span>
            <select id="serviceType">
              <option value="Reserva">Reserva</option>
              <option value="Locação">Locação</option>
              <option value="Dúvida">Dúvida</option>
            </select>
          </label>
          <label><span>Data</span><input id="interestDate" type="date" /></label>
          <label><span>Horário</span><input id="interestTime" type="time" /></label>
          <label><span>Estado do pagamento</span>
            <select id="paymentStatus">
              <option value="Não pago">Não pago</option>
              <option value="Sinal pago">Sinal pago</option>
              <option value="Pago">Pago</option>
            </select>
          </label>
          <label><span>Forma de pagamento</span>
            <select id="paymentMethod">
              <option value="A definir">A definir</option>
              <option value="Pix">Pix</option>
              <option value="Cartão de débito">Cartão de débito</option>
              <option value="Cartão de crédito">Cartão de crédito</option>
              <option value="Dinheiro">Dinheiro</option>
            </select>
          </label>
          <label><span>Observação</span><textarea id="interestNotes" rows="3" placeholder="Ex.: gostaria de saber horários disponíveis"></textarea></label>
          <button class="btn btn-whatsapp" type="submit">Enviar pedido pelo WhatsApp</button>
        </form>
      </div>
    </div>
  </aside>

  <div class="modal" id="detailsModal" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-card">
      <button class="modal-close" type="button" data-close-modal aria-label="Fechar">×</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/js/app.js"></script>
</body>
</html>
